<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ian O'Rourke — Product Manager | AI Strategist</title>
    <meta name="description" content="Ian O'Rourke - Product Manager and AI Strategist with 10+ years driving digital transformation, API integrations, and AI-powered product development.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #050508;
            --bg-secondary: #0a0a12;
            --bg-card: #0f0f1a;
            --bg-card-hover: #161625;
            --accent: #39ff14;
            --accent-dim: rgba(57,255,20,0.12);
            --accent-glow: rgba(57,255,20,0.4);
            --accent-bright: #5fff3a;
            --text: #e0e0ee;
            --text-secondary: #8888a0;
            --text-muted: #505068;
            --border: #1a1a2e;
            --border-bright: #2a2a44;
            --sans: 'Inter', -apple-system, sans-serif;
            --mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        html { scroll-behavior: smooth; }
        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-glow); }

        #matrix-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        #root { position: relative; z-index: 1; }

        /* ===== NAV ===== */
        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(5,5,8,0.8);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
        }
        .nav__inner {
            max-width: 1200px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
            height: 56px; padding: 0 32px;
        }
        .nav__logo {
            font-family: var(--mono); font-weight: 700; font-size: 15px;
            color: var(--accent); text-decoration: none; letter-spacing: -0.5px;
        }
        .nav__logo span { color: var(--text-muted); }
        .nav__links { display: flex; gap: 4px; list-style: none; }
        .nav__links a {
            color: var(--text-secondary); text-decoration: none;
            font-size: 13px; font-weight: 500;
            padding: 6px 14px; border-radius: 6px; transition: all 0.2s;
        }
        .nav__links a:hover, .nav__links a.active {
            color: var(--accent); background: var(--accent-dim);
        }
        .nav__mobile { display: none; background: none; border: 1px solid var(--border);
            color: var(--text); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 18px; }

        /* ===== HERO ===== */
        .hero { display: flex; flex-direction: column;
            padding: 80px 32px 40px; max-width: 1200px; margin: 0 auto; position: relative; }
        .hero__badge {
            display: inline-flex; align-items: center; gap: 8px; width: fit-content;
            background: var(--accent-dim); border: 1px solid rgba(57,255,20,0.2);
            color: var(--accent); font-family: var(--mono); font-size: 12px;
            padding: 6px 16px; border-radius: 20px; margin-bottom: 20px;
        }
        .hero__dot {
            width: 6px; height: 6px; background: var(--accent); border-radius: 50%;
            animation: pulse 2s ease infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .hero__layout {
            display: grid; grid-template-columns: 1fr 320px; gap: 40px; align-items: start;
        }
        .hero__left { }

        .hero__top { display: flex; align-items: flex-start; gap: 36px; margin-bottom: 28px; }
        .hero__photo {
            width: 150px; height: 150px; border-radius: 16px;
            border: 2px solid rgba(57,255,20,0.3); object-fit: cover;
            box-shadow: 0 0 30px rgba(57,255,20,0.1);
            transition: all 0.4s;
        }
        .hero__photo:hover { border-color: var(--accent); box-shadow: 0 0 50px rgba(57,255,20,0.2); transform: scale(1.03); }

        .hero__name {
            font-size: 52px; font-weight: 800; letter-spacing: -2px; line-height: 1.05;
            margin-bottom: 8px;
        }
        .hero__name .cursor {
            display: inline-block; width: 3px; height: 48px; background: var(--accent);
            margin-left: 4px; vertical-align: bottom;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

        .hero__title { font-size: 20px; color: var(--accent); font-weight: 500; margin-bottom: 20px; }

        .hero__tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
        .hero__tag {
            background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text-secondary); font-size: 12px; font-weight: 500;
            padding: 6px 14px; border-radius: 6px; transition: all 0.3s; cursor: default;
        }
        .hero__tag:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim);
            box-shadow: 0 0 15px rgba(57,255,20,0.1); transform: translateY(-2px); }

        .hero__summary { }
        .hero__summary h3 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        .hero__summary p { font-size: 15px; color: var(--text-secondary); line-height: 1.75; }
        .hero__achievements { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
        .hero__achievement {
            font-size: 14px; color: var(--text-secondary);
            display: flex; align-items: flex-start; gap: 10px;
        }
        .hero__achievement::before { content: '▹'; color: var(--accent); flex-shrink: 0; font-size: 16px; }

        .hero__scroll-hint { display: none; }
        @keyframes float { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-8px)} }

        /* ===== HERO SIDEBAR (contact panel) ===== */
        .hero-sidebar {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 14px; padding: 24px; position: sticky; top: 80px;
        }
        .hero-sidebar__title {
            font-size: 13px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; color: var(--text-muted); margin-bottom: 16px;
        }
        .hero-sidebar__items { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .hero-sidebar__item {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: var(--text-secondary); font-size: 13px;
            padding: 8px 12px; border-radius: 8px; transition: all 0.25s;
            background: rgba(255,255,255,0.02); border: 1px solid transparent;
        }
        .hero-sidebar__item:hover { color: var(--accent); border-color: rgba(57,255,20,0.2); background: var(--accent-dim); }
        .hero-sidebar__icon {
            width: 30px; height: 30px; background: var(--accent-dim);
            border-radius: 7px; display: flex; align-items: center; justify-content: center;
            color: var(--accent); font-size: 13px; flex-shrink: 0;
        }
        .hero-sidebar__btns { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .hero-sidebar__stats {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;
        }
        .hero-sidebar__stat {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border);
            border-radius: 8px; padding: 12px; text-align: center; transition: all 0.3s;
        }
        .hero-sidebar__stat:hover { border-color: rgba(57,255,20,0.25); }
        .hero-sidebar__stat-num {
            font-size: 24px; font-weight: 800; color: var(--accent);
            font-family: var(--mono); line-height: 1;
        }
        .hero-sidebar__stat-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
        .hero-sidebar__activities { font-size: 12px; color: var(--text-secondary); line-height: 1.9; }
        .hero-sidebar__divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

        /* ===== SECTIONS ===== */
        .section {
            padding: 80px 32px; max-width: 1200px; margin: 0 auto;
            border-top: 1px solid var(--border);
        }
        .section__header { display: flex; align-items: center; gap: 16px; margin-bottom: 40px; }
        .section__title { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
        .section__line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }
        .section__count {
            font-family: var(--mono); font-size: 12px; color: var(--accent);
            background: var(--accent-dim); padding: 4px 12px; border-radius: 12px;
        }

        /* ===== TERMINAL GAME ===== */
        .terminal-section { padding: 40px 32px; max-width: 1200px; margin: 0 auto; }
        .terminal {
            background: rgba(5,5,8,0.95); border: 1px solid var(--accent-dim);
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 0 40px rgba(57,255,20,0.05), inset 0 0 60px rgba(0,0,0,0.5);
            max-width: 800px; margin: 0 auto;
        }
        .terminal__bar {
            display: flex; align-items: center; gap: 8px;
            padding: 12px 16px; background: rgba(15,15,26,0.8);
            border-bottom: 1px solid var(--border);
        }
        .terminal__dot { width: 10px; height: 10px; border-radius: 50%; }
        .terminal__dot--red { background: #ff5f56; }
        .terminal__dot--yellow { background: #ffbd2e; }
        .terminal__dot--green { background: #27c93f; }
        .terminal__title {
            flex: 1; text-align: center; font-family: var(--mono);
            font-size: 12px; color: var(--text-muted);
        }
        .terminal__body {
            padding: 20px; height: 400px; overflow-y: auto; font-family: var(--mono); font-size: 13px;
        }
        .terminal__body::-webkit-scrollbar { width: 4px; }
        .terminal__body::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 2px; }

        .terminal__line { margin-bottom: 4px; line-height: 1.5; }
        .terminal__line--system { color: var(--text-muted); }
        .terminal__line--accent { color: var(--accent); }
        .terminal__line--info { color: #6699ff; }
        .terminal__line--warn { color: #ffbd2e; }
        .terminal__line--error { color: #ff5f56; }
        .terminal__line--success { color: var(--accent); font-weight: 600; }

        .terminal__input-row {
            display: flex; align-items: center; gap: 0;
            margin-top: 8px;
        }
        .terminal__prompt {
            color: var(--accent); font-family: var(--mono); font-size: 13px;
            white-space: nowrap;
        }
        .terminal__input {
            flex: 1; background: none; border: none; outline: none;
            color: var(--text); font-family: var(--mono); font-size: 13px;
            caret-color: var(--accent); padding-left: 4px;
        }

        .terminal__intro-title {
            text-align: center; font-size: 13px;
            margin-bottom: 16px; padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        /* ===== TIMELINE ===== */
        .timeline { position: relative; padding-left: 36px; }
        .timeline::before {
            content: ''; position: absolute; left: 8px; top: 0; bottom: 0;
            width: 2px; background: linear-gradient(180deg, var(--accent), var(--border) 60%, transparent);
        }
        .timeline__item {
            position: relative; margin-bottom: 32px;
            opacity: 0; transform: translateX(-20px);
            transition: all 0.7s cubic-bezier(0.16,1,0.3,1);
        }
        .timeline__item.visible { opacity: 1; transform: translateX(0); }
        .timeline__dot {
            position: absolute; left: -33px; top: 8px;
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--bg); border: 2px solid var(--accent); z-index: 2;
            transition: all 0.3s;
        }
        .timeline__item--current .timeline__dot {
            background: var(--accent); box-shadow: 0 0 16px var(--accent-glow);
        }
        .timeline__card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 24px; cursor: pointer; transition: all 0.3s;
            position: relative; overflow: hidden;
        }
        .timeline__card::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(57,255,20,0.03), transparent);
            opacity: 0; transition: opacity 0.3s;
        }
        .timeline__card:hover { border-color: rgba(57,255,20,0.3); transform: translateX(6px); }
        .timeline__card:hover::before { opacity: 1; }

        .timeline__role { font-size: 17px; font-weight: 700; position: relative; }
        .timeline__badge {
            display: inline-block; background: var(--accent); color: #000;
            font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px;
            margin-left: 10px; text-transform: uppercase; letter-spacing: 0.5px; vertical-align: middle;
        }
        .timeline__company { color: var(--accent); font-size: 14px; font-weight: 500; margin-top: 2px; }
        .timeline__meta {
            display: flex; gap: 16px; margin: 8px 0 12px;
            font-size: 12px; color: var(--text-muted); font-family: var(--mono);
        }
        .timeline__summary { font-size: 14px; color: var(--text-secondary); line-height: 1.65; position: relative; }
        .timeline__details {
            max-height: 0; overflow: hidden; transition: max-height 0.5s cubic-bezier(0.16,1,0.3,1);
        }
        .timeline__details.open { max-height: 500px; }
        .timeline__details-inner { padding-top: 14px; border-top: 1px solid var(--border); margin-top: 14px; }
        .timeline__detail {
            font-size: 13px; color: var(--text-secondary); padding: 3px 0;
            display: flex; align-items: flex-start; gap: 8px;
        }
        .timeline__detail::before { content: '•'; color: var(--accent); flex-shrink: 0; }
        .timeline__expand {
            font-size: 12px; color: var(--text-muted); margin-top: 10px;
            transition: color 0.2s; font-family: var(--mono);
        }
        .timeline__card:hover .timeline__expand { color: var(--accent); }

        /* ===== SKILLS ===== */
        .skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .skill-cat {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 24px; transition: all 0.3s;
            opacity: 0; transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.16,1,0.3,1);
        }
        .skill-cat.visible { opacity: 1; transform: translateY(0); }
        .skill-cat:hover { border-color: rgba(57,255,20,0.25); }
        .skill-cat__head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .skill-cat__name { font-size: 15px; font-weight: 700; }
        .skill-cat__level {
            font-family: var(--mono); font-size: 11px; color: var(--accent);
            background: var(--accent-dim); padding: 3px 10px; border-radius: 10px;
        }
        .skill-bar { margin-bottom: 14px; }
        .skill-bar__top { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .skill-bar__name { font-size: 13px; color: var(--text-secondary); }
        .skill-bar__pct { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
        .skill-bar__track { height: 5px; background: rgba(255,255,255,0.04); border-radius: 3px; overflow: hidden; }
        .skill-bar__fill {
            height: 100%; border-radius: 3px;
            background: linear-gradient(90deg, var(--accent), rgba(57,255,20,0.5));
            width: 0; transition: width 1.4s cubic-bezier(0.16,1,0.3,1);
            box-shadow: 0 0 8px rgba(57,255,20,0.2);
        }

        /* ===== EDU ===== */
        .edu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .edu-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 24px; transition: all 0.3s;
            opacity: 0; transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.16,1,0.3,1);
        }
        .edu-card.visible { opacity: 1; transform: translateY(0); }
        .edu-card:hover { border-color: rgba(57,255,20,0.25); }
        .edu-card__icon {
            width: 42px; height: 42px; background: var(--accent-dim);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            margin-bottom: 14px; font-size: 20px;
        }
        .edu-card__title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .edu-card__sub { font-size: 14px; color: var(--accent); margin-bottom: 4px; }
        .edu-card__date { font-family: var(--mono); font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
        .edu-card__tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .edu-card__tag {
            background: rgba(255,255,255,0.03); font-size: 11px; color: var(--text-secondary);
            padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border);
        }

        /* ===== PROJECTS ===== */
        .projects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .project-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 24px; transition: all 0.4s;
            opacity: 0; transform: translateY(20px);
            position: relative; overflow: hidden;
        }
        .project-card.visible { opacity: 1; transform: translateY(0); }
        .project-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0; transition: opacity 0.3s;
        }
        .project-card:hover {
            border-color: var(--accent); transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(57,255,20,0.1);
        }
        .project-card:hover::before { opacity: 1; }
        .project-card__tag {
            font-family: var(--mono); font-size: 11px; color: var(--accent);
            background: var(--accent-dim); padding: 4px 12px; border-radius: 10px;
            display: inline-block; margin-bottom: 14px;
        }
        .project-card__title { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
        .project-card__desc { font-size: 13px; color: var(--text-secondary); line-height: 1.65; margin-bottom: 16px; }
        .project-card__tech { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
        .project-card__tech-tag {
            font-size: 11px; color: var(--text-muted); background: rgba(255,255,255,0.03);
            border: 1px solid var(--border); padding: 3px 9px; border-radius: 4px;
        }
        .project-card__link {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--accent); font-size: 13px; font-weight: 600;
            text-decoration: none; transition: gap 0.2s; font-family: var(--mono);
        }
        .project-card__link:hover { gap: 12px; }

        /* ===== CONTACT SECTION ===== */
        .contact-section {
            padding: 80px 32px; max-width: 1200px; margin: 0 auto;
            border-top: 1px solid var(--border);
        }
        .contact-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
            max-width: 900px; margin: 0 auto;
        }
        .contact-info { display: flex; flex-direction: column; gap: 16px; }
        .contact-item {
            display: flex; align-items: center; gap: 14px;
            text-decoration: none; color: var(--text-secondary);
            font-size: 14px; padding: 12px 16px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; transition: all 0.3s;
        }
        .contact-item:hover { border-color: var(--accent); color: var(--accent); transform: translateX(4px); }
        .contact-item__icon {
            width: 36px; height: 36px; background: var(--accent-dim);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            color: var(--accent); font-size: 16px; flex-shrink: 0;
        }

        .contact-stats {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;
        }
        .stat-box {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; padding: 20px; text-align: center;
            transition: all 0.3s;
        }
        .stat-box:hover { border-color: rgba(57,255,20,0.3); }
        .stat-box__num {
            font-size: 32px; font-weight: 800; color: var(--accent);
            font-family: var(--mono); line-height: 1;
        }
        .stat-box__label { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

        .contact-btns { display: flex; gap: 12px; margin-top: 20px; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px 28px; border-radius: 8px; font-size: 14px; font-weight: 600;
            text-decoration: none; cursor: pointer; transition: all 0.3s; border: none;
            font-family: var(--sans);
        }
        .btn--primary { background: var(--accent); color: #000; }
        .btn--primary:hover { box-shadow: 0 0 30px var(--accent-glow); transform: translateY(-2px); }
        .btn--secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
        .btn--secondary:hover { background: var(--accent-dim); }

        /* ===== FOOTER ===== */
        .footer {
            border-top: 1px solid var(--border); padding: 28px 32px;
            display: flex; justify-content: space-between; align-items: center;
            max-width: 1200px; margin: 0 auto;
        }
        .footer__text { font-size: 13px; color: var(--text-muted); }
        .footer__top {
            color: var(--accent); text-decoration: none; font-size: 13px;
            font-weight: 500; font-family: var(--mono); transition: all 0.2s;
        }
        .footer__top:hover { text-shadow: 0 0 10px var(--accent-glow); }

        /* ===== ANIMATE HELPERS ===== */
        .fade-up {
            opacity: 0; transform: translateY(30px);
            transition: all 0.7s cubic-bezier(0.16,1,0.3,1);
        }
        .fade-up.visible { opacity: 1; transform: translateY(0); }

        /* ===== RESPONSIVE ===== */

        // ===== MATRIX RAIN =====
        function MatrixRain() {
            useEffect(() => {
                const canvas = document.getElementById('matrix-canvas');
                const ctx = canvas.getContext('2d');
                let animId;

                const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
                resize();
                window.addEventListener('resize', resize);

                const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF<>{}[]=/\\';
                const fontSize = 14;
                const columns = Math.floor(canvas.width / fontSize);
                const drops = new Array(columns).fill(1).map(() => Math.random() * -100);

                function draw() {
                    ctx.fillStyle = 'rgba(5, 5, 8, 0.06)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = 'rgba(57, 255, 20, 0.12)';
                    ctx.font = fontSize + 'px monospace';

                    for (let i = 0; i < drops.length; i++) {
                        const char = chars[Math.floor(Math.random() * chars.length)];
                        const x = i * fontSize;
                        const y = drops[i] * fontSize;

                        if (y > 0) {
                            ctx.globalAlpha = Math.random() * 0.15 + 0.03;
                            ctx.fillText(char, x, y);
                        }

                        if (y > canvas.height && Math.random() > 0.985) {
                            drops[i] = 0;
                        }
                        drops[i] += 0.5;
                    }
                    ctx.globalAlpha = 1;
                    animId = requestAnimationFrame(draw);
                }
                draw();
                return () => { cancelAnimationFrame(animId); window.removeEventListener('resize', resize); };
            }, []);
            return null;
        }

        // ===== SCROLL ANIMATION HOOK =====
        function useScrollReveal(ref, delay = 0) {
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const obs = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setTimeout(() => el.classList.add('visible'), delay);
                        obs.unobserve(el);
                    }
                }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
                obs.observe(el);
                return () => obs.disconnect();
            }, [ref, delay]);
        }

        function AnimateIn({ children, delay = 0, className = '' }) {
            const ref = useRef(null);
            useScrollReveal(ref, delay);
            return <div ref={ref} className={`fade-up ${className}`}>{children}</div>;
        }

        function TypeWriter({ text, speed = 60, onDone }) {
            const [displayed, setDisplayed] = useState('');

            useEffect(() => {
                let i = 0;
                const interval = setInterval(() => {
                    if (i < text.length) { setDisplayed(text.slice(0, i + 1)); i++; }
                    else { clearInterval(interval); setDone(true); onDone && onDone(); }
                }, speed);
                return () => clearInterval(interval);
            }, [text]);
            return <>{displayed}{!done && <span className="cursor"></span>}</>;
        }

                const trimmed = cmd.trim().toLowerCase();
                const newLines = [{ text: `  visitor@iorourke:~$ ${cmd}`, type: 'accent' }];

                if (trimmed === 'clear') {
                    setLines([]);
                    return;

                const handler = TERMINAL_COMMANDS[trimmed];

                    const result = handler();
                    const hasDelay = result.some(r => r.delay);
                    if (hasDelay) {
                        setLines(prev => [...prev, ...newLines]);
                        result.forEach(line => {
                            setTimeout(() => {
                                setLines(prev => [...prev, { text: line.text, type: line.type }]);

                        });

                        runCommand(input);

                    setInput('');

                        setInput(cmdHistory[next]);
                    }
                } else if (e.key === 'ArrowDown') {

                    if (histIdx > 0) {
                        setHistIdx(histIdx - 1);
                        setInput(cmdHistory[histIdx - 1]);

            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const obs = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setTimeout(() => setAnimated(true), delay);
                        obs.unobserve(el);
                    }
                }, { threshold: 0.3 });
                obs.observe(el);
                return () => obs.disconnect();
            }, [delay]);

            return (
                <div className="skill-bar" ref={ref}>
                    <div className="skill-bar__top">
                        <span className="skill-bar__name">{name}</span>
                        <span className="skill-bar__pct">{pct}%</span>
                    </div>
                    <div className="skill-bar__track">
                        <div className="skill-bar__fill" style={{width: animated ? `${pct}%` : '0%'}}></div>
                    </div>
                </div>
            );
        }

            return (
                <div ref={ref} className="skill-cat fade-up">

        // ===== COUNTER =====
        function Counter({ target, label }) {
            const [val, setVal] = useState(0);
            const ref = useRef(null);
            const started = useRef(false);

            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const obs = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting && !started.current) {
                        started.current = true;
                        let cur = 0;
                        const inc = Math.max(1, Math.ceil(target / 40));
                        const timer = setInterval(() => {
                            cur += inc;
                            if (cur >= target) { cur = target; clearInterval(timer); }
                            setVal(cur);
                        }, 35);
                        obs.unobserve(el);
                    }
                }, { threshold: 0.5 });
                obs.observe(el);
                return () => obs.disconnect();
            }, [target]);

            return (
                <div ref={ref}>
                    <div className="hero-sidebar__stat-num">{val}+</div>
                    <div className="hero-sidebar__stat-label">{label}</div>
                </div>
            );
        }
