eState(-1);\n            const bodyRef = useRef(null);\n            const inputRef = useRef(null);\n\n            const scrollBottom = () => {\n                if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight;\n            };\n\n            useEffect(scrollBottom, [lines]);\n\n            const runCommand = (cmd) => {\n                const trimmed = cmd.trim().toLowerCase();\n                const newLines = [{ text: `  visitor@iorourke:~$ ${cmd}`, type: 'accent' }];\n\n                if (trimmed === 'clear') {\n                    setLines([]);\n                    return;\n                }\n\n                const handler = TERMINAL_COMMANDS[trimmed];\n                if (handler) {\n                    const result = handler();\n                    const hasDelay = result.some(r => r.delay);\n                    if (hasDelay) {\n                        setLines(prev => [...prev, ...newLines]);\n                        result.forEach(line => {\n                            setTimeout(() => {\n                                setLines(prev => [...prev, { text: line.text, type: line.type }]);\n                            }, line.delay || 0);\n                        });\n                    } else {\n                        setLines(prev => [...prev, ...newLines, ...result, { text: '', type: 'system' }]);\n                    }\n                } else {\n                    setLines(prev => [...prev, ...newLines,\n                        { text: `  command not found: ${trimmed}. Type \"help\" for commands.`, type: 'error' },\n                        { text: '', type: 'system' },\n                    ]);\n                }\n            };\n\n            const handleKey = (e) => {\n                if (e.key === 'Enter') {\n                    if (input.trim()) {\n                        setCmdHistory(prev => [input, ...prev]);\n                        setHistIdx(-1);\n                        runCommand(input);\n                    }\n                    setInput('');\n                } else if (e.key === 'ArrowUp') {\n                    e.preventDefault();\n                    if (cmdHistory.length > 0) {\n                        const next = Math.min(histIdx + 1, cmdHistory.length - 1);\n                        setHistIdx(next);\n                        setInput(cmdHistory[next]);\n                    }\n                } else if (e.key === 'ArrowDown') {\n                    e.preventDefault();\n                    if (histIdx > 0) {\n                        setHistIdx(histIdx - 1);\n                        setInput(cmdHistory[histIdx - 1]);\n                    } else {\n                        setHistIdx(-1);\n                        setInput('');\n                    }\n                }\n            };\n\n            return (\n                <div className=\"terminal-section\" id=\"terminal\">\n                    <AnimateIn>\n                        <div style={{textAlign:'center', marginBottom: 32}}>\n                            <h2 style={{fontSize:28, fontWeight:800, letterSpacing:'-1px', marginBottom:8}}>Access Terminal</h2>\n                            <p style={{color:'var(--text-secondary)', fontSize:14, fontFamily:'var(--mono)'}}>\n                                Try typing <span style={{color:'var(--accent)'}}>help</span> to explore\n                            </p>\n                        </div>\n                    </AnimateIn>\n                    <AnimateIn delay={200}>\n                        <div className=\"terminal\" onClick={() => inputRef.current?.focus()}>\n                            <div className=\"terminal__bar\">\n                                <span className=\"terminal__dot terminal__dot--red\"></span>\n                                <span className=\"terminal__dot terminal__dot--yellow\"></span>\n                                <span className=\"terminal__dot terminal__dot--green\"></span>\n                                <span className=\"terminal__title\">visitor@iorourke ~ bash</span>\n                            </div>\n                            <div className=\"terminal__body\" ref={bodyRef}>\n                                {lines.map((line, i) => (\n                                    <div key={i} className={`terminal__line terminal__line--${line.type}`}>{line.text}</div>\n                                ))}\n                                <div className=\"terminal__input-row\">\n                                    <span className=\"terminal__prompt\">visitor@iorourke:~$&nbsp;</span>\n                                    <input\n                                        ref={inputRef}\n                                        className=\"terminal__input\"\n                                        value={input}\n                                        onChange={e => setInput(e.target.value)}\n                                        onKeyDown={handleKey}\n                                        autoComplete=\"off\"\n                                        spellCheck=\"false\"\n                                    />\n                                </div>\n                            </div>\n                        </div>\n                    </AnimateIn>\n                </div>\n            );\n        }\n\n        // ===== TIMELINE =====\n        function TimelineItem({ role, company, location, dates, summary, details, current, delay }) {\n            const [open, setOpen] = useState(false);\n            const ref = useRef(null);\n            useScrollReveal(ref, delay);\n\n            return (\n                <div ref={ref} className={`timeline__item ${current ? 'timeline__item--current' : ''} fade-up`}>\n                    <div className=\"timeline__dot\"></div>\n                    <div className=\"timeline__card\" onClick={() => setOpen(!open)}>\n                        <h3 className=\"timeline__role\">\n                            {role}{current && <span className=\"timeline__badge\">Current</span>}\n                        </h3>\n                        <div className=\"timeline__company\">{company}</div>\n                        <div className=\"timeline__meta\"><span>{location}</span><span>{dates}</span></div>\n                        <p className=\"timeline__summary\">{summary}</p>\n                        <div className={`timeline__details ${open ? 'open' : ''}`}>\n                            <div className=\"timeline__details-inner\">\n                                {details.map((d, i) => <div key={i} className=\"timeline__detail\">{d}</div>)}\n                            </div>\n                        </div>\n                        <p className=\"timeline__expand\">{open ? 'Click to collapse \u2191' : 'Click to view full details \u2192'}</p>\n                    </div>\n                </div>\n            );\n        }\n\n        function Experience() {\n            const roles = [\n                {\n                    role: 'Manager, Product Management', company: 'Capital One \u2014 Card Technology',\n                    location: 'McLean, VA', dates: 'Jan 2026 \u2014 Present', current: true,\n                    summary: 'Owning product on Card\\'s first workload on the modern financial core, pioneering AI-assisted spec-driven development, and leading agile delivery across cross-functional engineering teams.',\n                    details: ['Delivered a credit balance refund capability spanning multiple Card systems, making Recoveries the first Card workload on the modern core to de-risk other products','Pioneered an AI-assisted intent pipeline that turns requirements into specs ready for AI to generate production code \u2014 accelerating time to develop','Lead agile delivery across cross-functional teams, shipping 2 major releases per quarter and enabling daily minor releases via CI/CD'],\n                },\n                {\n                    role: 'Manager, Product Management', company: 'Capital One \u2014 Core Modernization',\n                    location: 'McLean, VA', dates: 'Jan 2024 \u2014 Jan 2026', current: false,\n                    summary: 'Led design and launch of a digital-first ledger replacing legacy mainframe, now servicing 13M+ Auto accounts at sub-100ms latency with 99.99% uptime.',\n                    details: ['Led design and launch of the digital-first ledger replacing the legacy mainframe \u2014 now servicing 13M+ Auto accounts at sub-100ms, cutting release cycles from years to months','Refined and tracked technical KPIs (uptime, throughput, API success rate), sustaining 99.99% uptime across 12 months in production','Ran product demos and technical reviews for customers, engineering teams and executive leadership, translating platform capabilities into terms each audience could act on'],\n                },\n                {\n                    role: 'Senior Associate, Product Management', company: 'Capital One \u2014 Core Modernization',\n                    location: 'McLean, VA', dates: 'Jan 2021 \u2014 Jan 2024', current: false,\n                    summary: 'Authored 20+ technical PRDs driving 70+ features into production. Conducted customer discovery that led to two patent applications.',\n                    details: ['Authored 20+ technical PRDs \u2014 including retroactive transaction application and automated balance recalculation \u2014 driving 70+ platform features into production on schedule','Conducted discovery with small-business cardholders, uncovering a card-request workflow gap that led to two patent applications: a utility patent for an off-the-shelf temporary credit card and a design patent for a pull-model card creation interface','Promoted from Senior Associate to Manager based on impact'],\n                },\n                {\n                    role: 'Integration Engineer', company: 'Capital One \u2014 DevExchange APIs',\n                    location: 'McLean, VA', dates: 'Aug 2019 \u2014 Jan 2021', current: false,\n                    summary: 'Integrated partners with APIs, built developer tooling, and improved partner onboarding for the DevExchange platform.',\n                    details: ['Built runnable Postman collections and sample apps covering the full OAuth handshake, getting partners through authentication faster with fewer escalations','Improved partner-facing integration docs and demoed flows live to partner engineering teams','Developed automation tools and SOPs that enabled future integration engineers to onboard smoothly'],\n                },\n                {\n                    role: 'Technical Consultant', company: 'Fishbowl Marketing, LLC',\n                    location: 'Alexandria, VA', dates: 'Aug 2014 \u2014 Aug 2019', current: false,\n                    summary: 'Consulted directly with restaurant clients to build data-driven marketing systems, automating behavioral targeting to engaged diners.',\n                    details: ['Gathered requirements and built data-driven marketing systems in JavaScript and SQL','Automated behavioral targeting to a client\\'s most engaged diners','Delivered SaaS digital marketing and data analytics solutions for the restaurant industry'],\n                },\n            ];\n\n            return (\n                <section className=\"section\" id=\"experience\">\n                    <div className=\"section__header\">\n                        <h2 className=\"section__title\">Experience</h2>\n                        <div className=\"section__line\"></div>\n                        <span className=\"section__count\">5 roles</span>\n                    </div>\n                    <div className=\"timeline\">\n                        {roles.map((r, i) => <TimelineItem key={i} {...r} delay={i * 150} />)}\n                    </div>\n                </section>\n            );\n        }\n\n        // ===== SKILLS =====\n        function SkillBar({ name, pct, delay }) {\n            const ref = useRef(null);\n            const [animated, setAnimated] = useState(false);\n\n            useEffect(() => {\n                const el = ref.current;\n                if (!el) return;\n                const obs = new IntersectionObserver(([entry]) => {\n                    if (entry.isIntersecting) {\n                        setTimeout(() => setAnimated(true), delay);\n                        obs.unobserve(el);\n                    }\n                }, { threshold: 0.3 });\n                obs.observe(el);\n                return () => obs.disconnect();\n            }, [delay]);\n\n            return (\n                <div className=\"skill-bar\" ref={ref}>\n                    <div className=\"skill-bar__top\">\n                        <span className=\"skill-bar__name\">{name}</span>\n                        <span className=\"skill-bar__pct\">{pct}%</span>\n                    </div>\n                    <div className=\"skill-bar__track\">\n                        <div className=\"skill-bar__fill\" style={{width: animated ? `${pct}%` : '0%'}}></div>\n                    </div>\n                </div>\n            );\n        }\n\n        function SkillCategory({ name, level, skills, delay }) {\n            const ref = useRef(null);\n            useScrollReveal(ref, delay);\n            return (\n                <div ref={ref} className=\"skill-cat fade-up\">\n                    <div className=\"skill-cat__head\">\n                        <h3 className=\"skill-cat__name\">{name}</h3>\n                        <span className=\"skill-cat__level\">{level}</span>\n                    </div>\n                    {skills.map((s, i) => <SkillBar key={i} name={s.name} pct={s.pct} delay={delay + i * 100} />)}\n                </div>\n            );\n        }\n\n        function Skills() {\n            const categories = [\n                { name: 'Product Management', level: 'Expert', skills: [\n                    {name:'Technical Spec & PRD Authoring', pct:95}, {name:'Technical Discovery', pct:92},\n                    {name:'Cross-functional Roadmap Dev', pct:90}, {name:'KPI Definition & Tracking', pct:93}\n                ]},\n                { name: 'AI & Development', level: 'Advanced', skills: [\n                    {name:'AI/ML Delivery', pct:90}, {name:'Spec-Driven AI Development', pct:88},\n                    {name:'AI-Assisted Coding', pct:85}, {name:'Product Analytics', pct:86}\n                ]},\n                { name: 'Technical Skills', level: 'Advanced', skills: [\n                    {name:'RESTful APIs & Integration', pct:94}, {name:'SQL & Python', pct:88},\n                    {name:'CI/CD & Agile Delivery', pct:90}, {name:'JavaScript & Web Dev', pct:82}\n                ]},\n                { name: 'Domain Expertise', level: 'Expert', skills: [\n                    {name:'Fintech & Card Issuing', pct:92}, {name:'Financial Ledgers & Processing', pct:90},\n                    {name:'A/B Testing & Experimentation', pct:85}, {name:'Enterprise Platform Products', pct:92}\n                ]},\n            ];\n\n            return (\n                <section className=\"section\" id=\"skills\">\n                    <div className=\"section__header\">\n                        <h2 className=\"section__title\">Skills & Expertise</h2>\n                        <div className=\"section__line\"></div>\n                    </div>\n                    <div className=\"skills-grid\">\n                        {categories.map((c, i) => <SkillCategory key={i} {...c} delay={i * 120} />)}\n                    </div>\n                </section>\n            );\n        }\n\n        // ===== EDUCATION =====\n        function Education() {\n            const ref1 = useRef(null);\n            const ref2 = useRef(null);\n            useScrollReveal(ref1, 0);\n            useScrollReveal(ref2, 150);\n\n            return (\n                <section className=\"section\" id=\"education\">\n                    <div className=\"section__header\">\n                        <h2 className=\"section__title\">Education & Credentials</h2>\n                        <div className=\"section__line\"></div>\n                    </div>\n                    <div className=\"edu-grid\">\n                        <div ref={ref1} className=\"edu-card fade-up\">\n                            <div className=\"edu-card__icon\">\ud83c\udf93</div>\n                            <h3 className=\"edu-card__title\">B.S., Computer Science Engineering</h3>\n                            <p className=\"edu-card__sub\">West Virginia University</p>\n                            <p className=\"edu-card__date\">Graduated May 2014</p>\n                            <div className=\"edu-card__tags\">\n                                {['Software Engineering','Data Structures','Database Design','Algorithms','Systems Architecture'].map((t,i) =>\n                                    <span key={i} className=\"edu-card__tag\">{t}</span>\n                                )}\n                            </div>\n                        </div>\n                        <div ref={ref2} className=\"edu-card fade-up\">\n                            <div className=\"edu-card__icon\">\ud83d\udccb</div>\n                            <h3 className=\"edu-card__title\">PMML Certificate</h3>\n                            <p className=\"edu-card__sub\">Professional Certification</p>\n                            <p className=\"edu-card__date\">&nbsp;</p>\n                            <div className=\"edu-card__tags\">\n                                {['Product Management','Machine Learning'].map((t,i) =>\n                                    <span key={i} className=\"edu-card__tag\">{t}</span>\n                                )}\n                            </div>\n                        </div>\n                    </div>\n                </section>\n            );\n        }\n\n        // ===== PROJECTS =====\n        function ProjectCard({ tag, title, desc, tech, link, delay }) {\n            const ref = useRef(null);\n            useScrollReveal(ref, delay);\n            return (\n                <div ref={ref} className=\"project-card fade-up\">\n                    <span className=\"project-card__tag\">{tag}</span>\n                    <h3 className=\"project-card__title\">{title}</h3>\n                    <p className=\"project-card__desc\">{desc}</p>\n                    <div className=\"project-card__tech\">\n                        {tech.map((t,i) => <span key={i} className=\"project-card__tech-tag\">{t}</span>)}\n                    </div>\n                    {link && <a href={link} className=\"project-card__link\" target=\"_blank\" rel=\"noopener\">View Live \u2192</a>}\n                </div>\n            );\n        }\n\n        // ===== CASE STUDY =====\n        function CaseStudy() {\n            return (\n                <section className=\"case-study\" id=\"case-study\">\n                    <div className=\"section__header\">\n                        <h2 className=\"section__title\">How I Build</h2>\n                        <div className=\"section__line\"></div>\n                        <span className=\"section__count\">Featured Case Study</span>\n                    </div>\n                    <div className=\"case-study__layout\">\n                        <div>\n                            <div className=\"case-study__subtitle\">HyperBreaks \u2014 Break Board</div>\n                            <p className=\"case-study__desc\">\n                                Built a real-time card break tracking platform from zero to live product in weeks using AI-assisted development. The break board gives collectors a live view of every card pulled, pricing, and chase tracking \u2014 replacing manual spreadsheets the community relied on.\n                            </p>\n                            <div className=\"case-study__steps\">\n                                <div className=\"case-study__step\">\n                                    <span className=\"case-study__step-num\">1</span>\n                                    <span><strong style={{color:'var(--text)'}}>Problem Discovery</strong> \u2014 Collectors had no way to track live card breaks, chase lists, or pull values in real time.</span>\n                                </div>\n                                <div className=\"case-study__step\">\n                                    <span className=\"case-study__step-num\">2</span>\n                                    <span><strong style={{color:'var(--text)'}}>Spec-Driven Design</strong> \u2014 Wrote a technical spec defining the data model, real-time update pipeline, and UI components before writing code.</span>\n                                </div>\n                                <div className=\"case-study__step\">\n                                    <span className=\"case-study__step-num\">3</span>\n                                    <span><strong style={{color:'var(--text)'}}>AI-Assisted Build</strong> \u2014 Used LLM-assisted coding to rapidly prototype and iterate on the full-stack application.</span>\n                                </div>\n                                <div className=\"case-study__step\">\n                                    <span className=\"case-study__step-num\">4</span>\n                                    <span><strong style={{color:'var(--text)'}}>Ship & Iterate</strong> \u2014 Launched to the collector community, gathering feedback and iterating on features like chase alerts and price tracking.</span>\n                                </div>\n                            </div>\n                            <div className=\"case-study__stats\">\n                                <div className=\"case-study__stat\">\n                                    <div className=\"case-study__stat-num\">100+</div>\n                                    <div className=\"case-study__stat-label\">Cards Tracked</div>\n                                </div>\n                                <div className=\"case-study__stat\">\n                                    <div className=\"case-study__stat-num\">Live</div>\n                                    <div className=\"case-study__stat-label\">Real-time Updates</div>\n                                </div>\n                                <div className=\"case-study__stat\">\n                                    <div className=\"case-study__stat-num\">Weeks</div>\n                                    <div className=\"case-study__stat-label\">Zero to Launch</div>\n                                </div>\n                            </div>\n                            <a href=\"https://hyperbreaks.com/board/galaxy-2026\" target=\"_blank\" rel=\"noopener noreferrer\" className=\"nav__cta\" style={{display:'inline-block',textDecoration:'none',textAlign:'center'}}>\n                                View Live Board \u2192\n                            </a>\n                        </div>\n                        <div className=\"case-study__preview\">\n                            <div className=\"case-study__preview-bar\">\n                                <span className=\"case-study__preview-dot case-study__preview-dot--r\"></span>\n                                <span className=\"case-study__preview-dot case-study__preview-dot--y\"></span>\n                                <span className=\"case-study__preview-dot case-study__preview-dot--g\"></span>\n                                <span className=\"case-study__preview-url\">hyperbreaks.com/board/galaxy-2026</span>\n                            </div>\n                            <div className=\"case-study__preview-body\">\n                                <div className=\"case-study__preview-title\">\u2605 Galaxy 2026 Break Board</div>\n                                <div className=\"case-study__preview-grid\">\n                                    <div className=\"case-study__preview-card\">\n                                        <div className=\"case-study__preview-name\">Darth Vader</div>\n                                        <div className=\"case-study__preview-meta\">Base \u2022 #DV-01</div>\n                                        <div className=\"case-study__preview-price\">$24.99</div>\n                                    </div>\n                                    <div className=\"case-study__preview-card\">\n                                        <div className=\"case-study__preview-name\">Luke Skywalker</div>\n                                        <div className=\"case-study__preview-meta\">Chase \u2022 #LS-07</div>\n                                        <div className=\"case-study__preview-price\">$149.99</div>\n                                    </div>\n                                    <div className=\"case-study__preview-card\">\n                                        <div className=\"case-study__preview-name\">Boba Fett</div>\n                                        <div className=\"case-study__preview-meta\">Rare \u2022 #BF-03</div>\n                                        <div className=\"case-study__preview-price\">$89.99</div>\n                                    </div>\n                                </div>\n                                <div className=\"case-study__preview-footer\">Live break tracking \u2022 Real-time pricing \u2022 Chase alerts</div>\n                            </div>\n                        </div>\n                    </div>\n                </section>\n            );\n        }\n\n        function Projects() {\n            const projects = [\n                {\n                    tag: 'AI / Web', title: 'iorourke.com',\n                    desc: 'This very site \u2014 a fully AI-generated digital resume built using vibe coding techniques and LLM-assisted development. Features an interactive hacker terminal and clean, minimal design.',\n                    tech: ['React','Claude AI','Vibe Coding','CSS3'],\n                    link: 'https://iorourke.com',\n                },\n                {\n                    tag: 'AI / SaaS', title: 'Razor IO',\n                    desc: 'AI-powered market research tool for validating business ideas. Generates instant viability scores, competition analysis, startup cost estimates, and demand trends for entrepreneurs.',\n                    tech: ['AI/ML','Market Research','SaaS','Full Stack'],\n                    link: 'https://razorio.com',\n                },\n            ];\n\n            return (\n                <section className=\"section\" id=\"projects\">\n                    <div className=\"section__header\">\n                        <h2 className=\"section__title\">AI Projects</h2>\n                        <div className=\"section__line\"></div>\n                        <span className=\"section__count\">2 projects</span>\n                    </div>\n                    <div className=\"projects-grid\">\n                        {projects.map((p, i) => <ProjectCard key={i} {...p} delay={i * 150} />)}\n                    </div>\n                </section>\n            );\n        }\n\n        // ===== COUNTER =====\n        function Counter({ target, label }) {\n            const [val, setVal] = useState(0);\n            const ref = useRef(null);\n            const started = useRef(false);\n\n            useEffect(() => {\n                const el = ref.current;\n                if (!el) return;\n                const obs = new IntersectionObserver(([entry]) => {\n                    if (entry.isIntersecting && !started.current) {\n                        started.current = true;\n                        let cur = 0;\n                        const inc = Math.max(1, Math.ceil(target / 40));\n                        const timer = setInterval(() => {\n                            cur += inc;\n                            if (cur >= target) { cur = target; clearInterval(timer); }\n                            setVal(cur);\n                        }, 35);\n                        obs.unobserve(el);\n                    }\n                }, { threshold: 0.5 });\n                obs.observe(el);\n                return () => obs.disconnect();\n            }, [target]);\n\n            return (\n                <div ref={ref}>\n                    <div className=\"hero-sidebar__stat-num\">{val}+</div>\n                    <div className=\"hero-sidebar__stat-label\">{label}</div>\n                </div>\n            );\n        }\n\n        // ===== APP =====\n        function App() {\n            return (\n                <>\n                    <Nav />\n                    <Hero />\n                    <Terminal />\n                    <CaseStudy />\n                    <Projects />\n                    <Experience />\n                    <Skills />\n                    <Education />\n                    <footer className=\"footer\">\n                        <p className=\"footer__text\">\u00a9 2026 Ian O'Rourke. Built with AI.</p>\n                        <a href=\"#about\" className=\"footer__top\">\u2191 back_to_top</a>\n                    </footer>\n                </>\n            );\n        }\n\n        ReactDOM.createRoot(document.getElementById('root')).render(<App />);\n";
